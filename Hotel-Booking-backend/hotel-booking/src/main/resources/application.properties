# ------------------------
# Spring Application Name
# ------------------------
spring.application.name=hotel-booking

# ------------------------
# DATABASE CONFIG (Render PostgreSQL)
# ------------------------
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ------------------------
# Connection Pool (HikariCP - Recommended)
# ------------------------
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1800000

# ------------------------
# JPA / Hibernate Config
# ------------------------
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Format SQL (optional - disable in production if not needed)
spring.jpa.properties.hibernate.format_sql=true

# ------------------------
# Logging (Recommended)
# ------------------------
logging.level.org.springframework=INFO
logging.level.org.hibernate.SQL=INFO
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=INFO

# ------------------------
# File Upload Config
# ------------------------
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

# ------------------------
# Server Config (Render Required)
# ------------------------
server.port=${PORT:8080}

# ------------------------
# Jackson Config (Optional but recommended)
# ------------------------
spring.jackson.serialization.fail-on-empty-beans=false

# ------------------------
# Disable Spring Boot banner (optional)
# ------------------------
spring.main.banner-mode=off
