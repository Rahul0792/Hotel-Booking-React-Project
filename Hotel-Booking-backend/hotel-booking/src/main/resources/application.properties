# ------------------------
# Spring Application Name
# ------------------------
spring.application.name=hotel-booking

# ------------------------
# Server Config (Render Required)
# ------------------------
server.port=${PORT:8080}
server.address=0.0.0.0

# ------------------------
# DATABASE CONFIG (Render PostgreSQL)
# ------------------------
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ------------------------
# HikariCP Connection Pool (Render Optimized)
# ------------------------
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1800000

# ------------------------
# JPA / Hibernate Config (Optimized)
# ------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=false

# Hibernate auto-detect dialect (recommended)
# spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# ------------------------
# FAST STARTUP OPTIMIZATION (VERY IMPORTANT FOR RENDER FREE TIER)
# ------------------------
spring.main.lazy-initialization=true
spring.jpa.defer-datasource-initialization=true

# ------------------------
# ACTUATOR CONFIG (REQUIRED FOR HEALTH CHECK)
# ------------------------
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
management.endpoints.web.base-path=/actuator

# Enable health probes
management.endpoint.health.probes.enabled=true

# ------------------------
# Logging Optimization (Reduce startup delay)
# ------------------------
logging.level.root=INFO
logging.level.org.springframework=WARN
logging.level.org.hibernate=WARN
logging.level.com.zaxxer.hikari=WARN

# ------------------------
# File Upload Config
# ------------------------
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# ------------------------
# Jackson Config
# ------------------------
spring.jackson.serialization.fail-on-empty-beans=false

# ------------------------
# Disable Spring Banner (optional)
# ------------------------
spring.main.banner-mode=off

# ------------------------
# Graceful Shutdown (Recommended)
# ------------------------
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s
